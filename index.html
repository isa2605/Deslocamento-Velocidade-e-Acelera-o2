<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Físico-Mecânica</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <button id="btnFullscreen" class="btn-fullscreen">📌 Tela Inteira</button>

    <main class="container">
        <header>
            <h1>Calculadora Físico-Mecânica</h1>
            <p class="subtitle">Movimento retilíneo partindo do repouso ($v_0 = 0$)</p>
        </header>

        <form id="physicsForm">
            <div class="form-grid">
                <div class="form-group">
                    <label for="massa">Massa (kg):</label>
                    <input type="number" id="massa" step="any" placeholder="Ex: 10" required>
                </div>

                <div class="form-group">
                    <label for="distancia">Distância (m):</label>
                    <input type="number" id="distancia" step="any" placeholder="Ex: 50" required>
                </div>

                <div class="form-group">
                    <label for="tempo">Tempo (s):</label>
                    <input type="number" id="tempo" step="any" placeholder="Ex: 5" required>
                </div>
            </div>

            <button type="button" id="btnCalcular" class="btn-primary">Calcular</button>
        </form>

        <div class="error-message" id="errorMessage"></div>

        <section class="results" id="resultsSection">
            <h2>Resultados</h2>
            <div class="results-grid">
                <div class="result-card">
                    <span class="result-label">Aceleração ($a$)</span>
                    <span class="result-value" id="resAceleracao">-</span>
                </div>
                <div class="result-card">
                    <span class="result-label">Força ($F$)</span>
                    <span class="result-value" id="resForca">-</span>
                </div>
                <div class="result-card">
                    <span class="result-label">Energia ($E$)</span>
                    <span class="result-value" id="resEnergia">-</span>
                </div>
                <div class="result-card">
                    <span class="result-label">Potência ($P$)</span>
                    <span class="result-value" id="resPotencia">-</span>
                </div>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
